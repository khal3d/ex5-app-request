<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EX5 EM-i App Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: owner-petition page. Context + form on the left, live email draft on the right; stacks on phones. */
:root {
  --bg: #eef1f3;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #5a6875;
  --line: #d3dae0;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --ok: #1f7a4d;
  --bad: #b3372b;
  --paper: #f8fafb;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #172129; --ink: #e4ebf0; --muted: #93a3b0; --line: #2a3843;
    --accent: #3fb3d4; --accent-ink: #06222b; --ok: #4cc88a; --bad: #f07a6d; --paper: #121b22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #172129; --ink: #e4ebf0; --muted: #93a3b0; --line: #2a3843;
  --accent: #3fb3d4; --accent-ink: #06222b; --ok: #4cc88a; --bad: #f07a6d; --paper: #121b22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--body);
  padding: 40px 20px 64px;
}
.wrap { max-width: 1120px; margin: 0 auto; }
form h1 { font-size: clamp(26px, 5vw, 34px); }
header { display: grid; gap: 12px; max-width: 760px; }
.eyebrow {
  font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
}
h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 46px);
  line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.01em;
}
.lede { margin: 0; color: var(--muted); font-size: 17px; max-width: 62ch; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 32px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 28px; min-width: 0; }

h2 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0; }
.section { display: grid; gap: 14px; }

/* Connectivity comparison */
.status { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.status li {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.model { font-weight: 600; }
.model small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.pill {
  font: 500 12px/1 var(--mono); padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  border: 1px solid currentColor;
}
.pill.ok { color: var(--ok); }
.pill.bad { color: var(--bad); }
.pill .sig { display: inline-block; margin-right: 6px; letter-spacing: -1px; }

/* Form */
form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 18px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; }
label { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
label .opt { font-weight: 400; color: var(--muted); }
input, textarea {
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%;
}
input:focus-visible, textarea:focus-visible, .btn:focus-visible, .link:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
#vin { font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.hint { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint.warn { color: var(--bad); }
.err { color: var(--bad); font-size: 13px; margin: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 600 15px/1 var(--body); text-decoration: none;
  padding: 13px 20px; border-radius: 6px; border: 1px solid var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.note { font-size: 13px; color: var(--muted); margin: 0; }

/* Email preview */
.mail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 880px) { .mail { position: static; } }
.mail-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; background: var(--paper); }
.mh-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; }
.mh-row > span:first-child { color: var(--muted); font: 500 12px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px/1 var(--mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); overflow-wrap: anywhere; }
.subject { font-weight: 600; }
.mail-body { padding: 20px; white-space: pre-wrap; font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; max-height: 640px; overflow: auto; }
.mail-body mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.mail-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 14px; }
.link { background: none; border: 0; padding: 0; font: 500 13px var(--body); color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.toast { font-size: 13px; color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .btn { transition: filter .15s, background .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="grid">
      <form id="f" novalidate>
        <h1>Enable the Geely app for the EX5 EM-i</h1>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" autocomplete="name" placeholder="e.g. Khaled Attia" required>
        </div>
        <div class="field">
          <label for="vin">VIN / chassis number <span class="opt">Optional</span></label>
          <input id="vin" maxlength="17" autocomplete="off" spellcheck="false" placeholder="e.g. LB3P11SD5VH512907">
          <span class="hint" id="vin-hint">0 / 17 characters</span>
        </div>
        <div class="field">
          <label for="phone">Phone <span class="opt">Optional</span></label>
          <input id="phone" type="tel" autocomplete="tel" placeholder="+20 …">
        </div>
        <p class="err" id="err" hidden>Add your name so Geely knows who the request is from.</p>
        <div class="actions">
          <a class="btn primary" id="send" href="#">Send email</a>
        </div>
        <p class="note">Send opens your mail app with the email ready to go. If nothing opens, use the copy links under the email to paste it into a new message. </p>
      </form>

    <aside class="mail" aria-label="Email preview">
      <div class="mail-head">
        <div class="mh-row"><span>To</span><div class="chips" id="to"></div></div>
        <div class="mh-row"><span>Subject</span><div class="subject" id="subj"></div></div>
      </div>
      <div class="mail-body" id="body"></div>
      <div class="mail-foot">
        <button type="button" class="link" id="copy-to">Copy addresses</button>
        <button type="button" class="link" id="copy-subj">Copy subject</button>
        <button type="button" class="link" id="copy-body">Copy body</button>
        <span class="toast" id="toast" role="status"></span>
      </div>
    </aside>
  </div>
</div>

<script>
const TO = [
  "globalservice@geely.com",
  "info@aboughalymotors.com",
  "geely.global.pr@geely.com",
  "zhu.eddie@geely.com",
  "yuming.yang2@geely.com"
];
const SUBJECT = "Request to Enable Geely App Connectivity for EX5 EM-i in Egypt";
const BODY = `Dear Geely Global Team and Geely Egypt Team,

I'm writing as an owner of a Geely Galaxy EX5 EM-i in Egypt to request that you enable the official Geely mobile app and vehicle connectivity for the EX5 EM-i in the Egyptian market.

Currently, the EX5 EM-i is being delivered in Egypt without access to the official Geely app or any of its vehicle connectivity and remote-control features.

We would like to understand why these features are not enabled for the EX5 EM-i in Egypt, especially since other Geely models, such as the Monjaro EM-i, already support app connectivity, and the upcoming smaller Geely EX2 is also expected to support it.

The EX5 EM-i is a larger and more advanced model, and there doesn't seem to be a reason why its owners should not have access to the connected-car features already supported by the vehicle.

We would appreciate it if Geely could enable the official mobile app and activate connectivity for existing EX5 EM-i vehicles in Egypt, not only for future deliveries.

We are also ready to provide our VIN/chassis numbers to the technical team if this is required for activation or further investigation.

We would appreciate an official response explaining the current situation and, more importantly, a clear timeline for when we can expect this functionality to be activated in Egypt.`;

const $ = id => document.getElementById(id);
const els = { name: $("name"), vin: $("vin"), phone: $("phone") };

function values() {
  return {
    name: els.name.value.trim(),
    vin: els.vin.value.trim().toUpperCase(),
    phone: els.phone.value.trim()
  };
}

function signature(v) {
  const sig = [v.name || "[Your name]"];
  if (v.vin) sig.push("VIN: " + v.vin);
  if (v.phone) sig.push("Phone: " + v.phone);
  return sig.join("\n");
}

function composeText(v) {
  return BODY + "\n\nBest regards,\n" + signature(v);
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function render() {
  const v = values();
  $("body").innerHTML = esc(BODY) + "\n\nBest regards,\n<mark>" + esc(signature(v)) + "</mark>";
  const href = "mailto:" + TO.join(",") +
    "?subject=" + encodeURIComponent(SUBJECT) +
    "&body=" + encodeURIComponent(composeText(v));
  $("send").href = href;

  const n = v.vin.length;
  const hint = $("vin-hint");
  hint.textContent = n + " / 17 characters" + (n && n < 17 ? ". A VIN has 17." : "");
  hint.classList.toggle("warn", n > 0 && n < 17);
  if (v.name) $("err").hidden = true;
}

$("to").innerHTML = TO.map(a => `<span class="chip">${a}</span>`).join("");
$("subj").textContent = SUBJECT;

Object.values(els).forEach(el => el.addEventListener("input", render));
els.vin.addEventListener("input", () => {
  const pos = els.vin.selectionStart;
  els.vin.value = els.vin.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  els.vin.setSelectionRange(pos, pos);
  render();
});

$("send").addEventListener("click", e => {
  if (!values().name) {
    e.preventDefault();
    $("err").hidden = false;
    els.name.focus();
  }
});
$("f").addEventListener("submit", e => e.preventDefault());

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.textContent = ""), 2400);
}
function selectNode(node) {
  const r = document.createRange(); r.selectNodeContents(node);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function copy(text, label, fallbackNode) {
  const fail = () => { if (fallbackNode) selectNode(fallbackNode); toast("Copy blocked here. The text is selected, press Ctrl/Cmd+C."); };
  try {
    navigator.clipboard.writeText(text).then(() => toast(label + " copied"), fail);
  } catch (_) { fail(); }
}
$("copy-to").addEventListener("click", () => copy(TO.join(", "), "Addresses", $("to")));
$("copy-subj").addEventListener("click", () => copy(SUBJECT, "Subject", $("subj")));
$("copy-body").addEventListener("click", () => copy(composeText(values()), "Body", $("body")));

render();
</script>
</body>
</html>
